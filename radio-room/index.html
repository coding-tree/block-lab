<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioRoom — Wiadomości i radio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090f; --bg2: #0f0f1a; --bg3: #16162a; --bg4: #1e1e36;
  --border: #2a2a4a; --border2: #3a3a6a;
  --text: #e8e8f0; --muted: #6060a0;
  --green: #00ff88; --blue: #4488ff; --purple: #bb66ff;
  --red: #ff4466; --orange: #ffaa00; --cyan: #00ddff; --yellow: #ffd93d;
  --pink: #ff55ff;
  --font: 'Outfit', sans-serif; --mono: 'DM Mono', monospace;
  --r: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

.topbar { height: 48px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; }
.topbar .logo { font-weight: 900; font-size: 18px; letter-spacing: -.5px; }
.topbar .logo span { color: var(--pink); }
.topbar .logo em { font-style: normal; color: var(--cyan); }
.topbar .spacer { flex: 1; }
.topbar .badge { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.main { height: calc(100% - 48px); display: flex; position: relative; }
.view { display: none; width: 100%; height: 100%; }
.view.active { display: flex; }

#tree-view { flex-direction: column; align-items: center; overflow-y: auto; padding: 40px 20px 80px; }
.tree-track-label {
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
  padding: 6px 16px; border-radius: 20px; margin: 30px 0 16px;
}
.tree-track-label.green { color: var(--green); background: #00ff8815; }
.tree-track-label.blue { color: var(--blue); background: #4488ff15; }
.tree-connector { width: 2px; height: 28px; background: var(--border); }
.tree-node {
  width: 200px; padding: 16px; border-radius: var(--r); border: 2px solid var(--border);
  background: var(--bg2); text-align: center; cursor: pointer; transition: all .2s;
  position: relative;
}
.tree-node:hover { border-color: var(--border2); transform: translateY(-2px); }
.tree-node.locked { opacity: .4; cursor: default; filter: grayscale(.6); }
.tree-node.locked:hover { transform: none; border-color: var(--border); }
.tree-node.available { border-color: var(--border2); animation: pulse-border 2s ease-in-out infinite; }
.tree-node.complete .node-icon { filter: none; }
.tree-node .node-icon { font-size: 28px; margin-bottom: 6px; }
.tree-node .node-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.tree-node .node-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
.tree-node .node-stars { margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: 2px; }
@keyframes pulse-border { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 16px -4px var(--border2); } }

.tree-node.t-green { border-color: #00ff8833; }
.tree-node.t-green.available { border-color: var(--green); box-shadow: 0 0 20px -6px var(--green); }
.tree-node.t-green.complete { border-color: var(--green); background: #00ff8808; }
.tree-node.t-blue { border-color: #4488ff33; }
.tree-node.t-blue.available { border-color: var(--blue); box-shadow: 0 0 20px -6px var(--blue); }
.tree-node.t-blue.complete { border-color: var(--blue); background: #4488ff08; }

#browser-view { flex-direction: column; padding: 24px 32px; overflow-y: auto; }
.browser-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.browser-header .back {
  padding: 6px 12px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); border-radius: 8px; cursor: pointer; font-family: var(--font);
}
.browser-header .back:hover { color: var(--text); border-color: var(--border2); }
.browser-header h2 { font-weight: 800; font-size: 20px; }
.challenge-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r);
  margin-bottom: 10px; cursor: pointer; transition: all .15s;
}
.challenge-item:hover { border-color: var(--border2); transform: translateX(4px); }
.challenge-item .ci-num { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 24px; }
.challenge-item .ci-title { flex: 1; font-weight: 600; font-size: 13px; }
.challenge-item .ci-stars { font-size: 14px; letter-spacing: 1px; }

#challenge-view { flex-direction: column; }
.ch-topbar {
  display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.ch-topbar .back {
  padding: 6px 12px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); border-radius: 8px; cursor: pointer; font-family: var(--font);
}
.ch-topbar .back:hover { color: var(--text); border-color: var(--border2); }
.ch-topbar .ch-title { font-weight: 700; flex: 1; }
.ch-topbar .ch-stars { font-size: 18px; letter-spacing: 2px; }
.ch-body { flex: 1; display: flex; overflow: hidden; }
.ch-col { padding: 16px; overflow-y: auto; }
.palette { width: 220px; border-right: 1px solid var(--border); background: var(--bg2); }
.ch-main { flex: 1; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.script-area {
  width: 100%; max-width: 520px; min-height: 160px;
  background: var(--bg2); border: 1px dashed var(--border); border-radius: var(--r); padding: 12px;
}
.script-body { min-height: 28px; }
.script-body::after {
  content: '+ upuść tu blok'; display: block; padding: 4px 0;
  color: var(--muted); font-size: 11px; font-style: italic; opacity: 0.5;
}
#scene { background: #000; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 8px; }
.ch-controls { display: flex; gap: 10px; }
.ch-controls button {
  padding: 8px 16px; border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text); border-radius: 8px; cursor: pointer; font-family: var(--font); font-weight: 600;
}
.ch-controls button:hover { background: var(--bg4); }
.ch-side { width: 280px; border-left: 1px solid var(--border); background: var(--bg2); }
.ch-goal {
  font-size: 13px; color: var(--muted); line-height: 1.5;
  margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.ch-tests div { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 12px; }
.ch-tests .t-pass { color: var(--green); }
.ch-tests .t-fail { color: var(--red); }
.ch-tests .t-pending { color: var(--muted); }
.ch-msg { margin-top: 12px; font-weight: 600; font-size: 13px; }
.ch-msg.success { color: var(--green); }
.ch-msg.fail { color: var(--red); }

.palette-cat { margin-bottom: 14px; }
.palette-cat-label { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.palette-block { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: var(--mono); color: var(--text); cursor: grab; margin-bottom: 4px; user-select: none; }
.palette-block.b-draw   { background: #ff55ff22; border: 1px solid #ff55ff55; }
.palette-block.b-loop   { background: #00ff8822; border: 1px solid #00ff8855; }
.palette-block.b-state  { background: #4488ff22; border: 1px solid #4488ff55; }
.palette-block.b-math   { background: #ffaa0022; border: 1px solid #ffaa0055; }
.palette-block.b-motion { background: #00ddff22; border: 1px solid #00ddff55; }
.hole { display: inline-block; min-width: 56px; padding: 1px 10px; background: var(--bg4); border: 2px dashed var(--border2); border-radius: 5px; color: var(--muted); font-size: 13px; text-align: center; transition: all .12s; }
.slot:not([data-locked="1"]) { cursor: text; }
.slot[data-locked="1"] { cursor: not-allowed; opacity: 0.65; }
/* Drag-over feedback */
.slot.dragover, [data-role="body"].dragover { background: rgba(0, 221, 255, 0.14); box-shadow: 0 0 8px rgba(0, 221, 255, 0.45); border-radius: 5px; }
.slot.dragover .hole, .hole.dragover { border-color: #00ddff; background: rgba(0, 221, 255, 0.22); color: var(--text); }
/* Click-to-place: armed palette block + valid drop targets */
.palette-block.selected { outline: 2px solid #00ddff; outline-offset: 2px; box-shadow: 0 0 10px rgba(0, 221, 255, 0.55); }
.slot.target, [data-role="body"].target { outline: 2px dashed #00ddff; outline-offset: 1px; animation: target-pulse 1.4s ease-in-out infinite; cursor: copy; }
.slot.target .hole { border-color: #00ddff; background: rgba(0, 221, 255, 0.16); color: var(--text); }
@keyframes target-pulse { 0%,100% { outline-color: #00ddff; } 50% { outline-color: rgba(0,221,255,0.35); } }
/* Remove button — always visible but dim, pops on hover */
.btn-remove { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; background: rgba(255, 90, 90, 0.18); color: #ff8a8a; font-size: 13px; font-weight: bold; line-height: 1; cursor: pointer; opacity: 0.45; transition: opacity .12s, background .12s, transform .12s; user-select: none; vertical-align: middle; }
.btn-remove:hover { opacity: 1; background: rgba(255, 90, 90, 0.55); transform: scale(1.15); }
.palette-block:hover > .btn-remove, .slot:hover > .btn-remove { opacity: 0.85; }
.nested { display: inline-block; padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 11px; }
.nested.b-draw   { background: #ff55ff33; }
.nested.b-loop   { background: #00ff8833; }
.nested.b-state  { background: #4488ff33; }
.nested.b-math   { background: #ffaa0033; }
.nested.b-motion { background: #00ddff33; }

/* Device row + LED display */
.devices-stage { position: relative; margin-bottom: 12px; }
.devices-row {
  display: flex; flex-wrap: wrap; gap: 16px; padding: 14px;
  background: #000; border: 1px solid var(--border); border-radius: 8px;
  min-height: 160px;
}
.radio-space {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  border-radius: 8px;
}
.dot {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px currentColor;
  font-family: var(--mono); font-size: 9px; color: #000; text-align: center; line-height: 10px;
}
.dot.dropped { color: #ff5566 !important; background: transparent !important; box-shadow: none !important; font-size: 14px; font-weight: 700; }
.dice {
  position: absolute; width: 18px; height: 18px; line-height: 18px;
  font-family: var(--mono); font-size: 11px; color: var(--text);
  background: var(--bg3); border: 1px solid var(--border2); border-radius: 4px;
  text-align: center; transform: translate(-50%, -50%);
  pointer-events: none; opacity: 0;
}
/* Knobs */
.knobs-panel {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  padding: 8px 12px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
}
.knob { display: flex; align-items: center; gap: 6px; }
.knob label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.knob input[type="range"] { width: 90px; accent-color: var(--cyan); }
.knob input[type="text"] { width: 60px; padding: 2px 6px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-family: var(--mono); font-size: 11px; }
.knob input[type="checkbox"] { accent-color: var(--cyan); }
.knob-value { color: var(--cyan); min-width: 42px; text-align: right; }
/* Stats */
.stats-panel {
  margin-top: 12px; padding: 10px 12px; font-family: var(--mono); font-size: 11px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
}
.stats-panel-title { color: var(--muted); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
.stats-row { display: grid; grid-template-columns: 36px 60px 60px 50px; gap: 8px; padding: 2px 0; color: var(--text); }
.stats-row.head { color: var(--muted); font-size: 10px; }
.stats-channel-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.device {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; transition: border-color .12s, transform .12s;
  min-width: 92px;
}
.device:hover { border-color: var(--border2); transform: translateY(-1px); }
.device.active { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,255,255,0.25); }
.device-name { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--text); }
.device-led {
  display: grid; grid-template-columns: repeat(5, 12px); grid-template-rows: repeat(5, 12px);
  gap: 2px; padding: 4px; background: #050510; border-radius: 4px;
}
.led-cell { width: 12px; height: 12px; border-radius: 2px; background: #1a1a2a; transition: background .08s; }
.led-cell.on { background: #ff3344; box-shadow: 0 0 6px rgba(255,51,68,0.65); }
.device-channel { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.device-buttons { display: flex; gap: 4px; }
.dev-btn {
  width: 22px; height: 22px; padding: 0; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  font-family: var(--mono); font-size: 11px; font-weight: 700; cursor: pointer;
}
.dev-btn:hover { background: var(--bg4); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span>Radio</span><em>Room</em></div>
  <div class="spacer"></div>
  <div class="badge" id="stars-badge">⭐ 0 / 0</div>
</div>
<div class="main">
  <div id="tree-view" class="view active"><div id="tree-root"></div></div>
  <div id="challenge-view" class="view">
    <div class="ch-topbar">
      <button class="back" onclick="ps.backToStage()">← wyzwania</button>
      <span class="ch-title" id="ch-title"></span>
      <span class="ch-stars" id="ch-stars">☆☆☆</span>
    </div>
    <div class="ch-body">
      <aside id="palette" class="ch-col palette"></aside>
      <section class="ch-col ch-main">
        <div class="devices-stage">
          <div id="devices-row" class="devices-row"></div>
          <div id="radio-space" class="radio-space"></div>
        </div>
        <div id="knobs-panel" class="knobs-panel">
          <div class="knob"><label>drop %</label><input id="knob-drop" type="range" min="0" max="80" value="0"><span id="knob-drop-val" class="knob-value">0%</span></div>
          <div class="knob"><label>opóźnienie</label><input id="knob-delay" type="range" min="0" max="2000" step="50" value="0"><span id="knob-delay-val" class="knob-value">0ms</span></div>
          <div class="knob"><label><input id="knob-reorder" type="checkbox"> kolejność losowa</label></div>
          <div class="knob"><label>ziarno</label><input id="knob-seed" type="text" placeholder="losowe" maxlength="8"></div>
        </div>
        <div id="script-area" class="script-area"></div>
        <div class="ch-controls">
          <button id="btn-run">▶ Uruchom</button>
          <button id="btn-reset">🔄 Reset</button>
          <button id="btn-check">✓ Sprawdź</button>
        </div>
      </section>
      <aside class="ch-col ch-side">
        <div id="ch-goal" class="ch-goal"></div>
        <div id="ch-tests" class="ch-tests"></div>
        <div id="ch-msg" class="ch-msg"></div>
        <div id="stats-panel" class="stats-panel"></div>
      </aside>
    </div>
  </div>
  <div id="browser-view" class="view"></div>
</div>
<script>
const STAGES = [
  { id: 'msgs', track: 'basics', title: 'Wiadomości',          icon: '📡', desc: 'broadcast i kanały',          requires: [],       unlockedCats: ['events','radio','display','state','flow'] },
  { id: 'prob', track: 'prob',   title: 'Prawdopodobieństwo',  icon: '🎲', desc: 'drop, opóźnienie, kolejność',  requires: ['msgs'], unlockedCats: ['events','radio','display','state','flow'] },
  { id: 'ec',   track: 'ec',     title: 'Spójność',            icon: '🔁', desc: 'rozjazd i godzenie stanu',     requires: ['prob'], unlockedCats: ['events','radio','display','state','flow'] },
];

const TRACKS = {
  basics: { label: 'Wiadomości',         color: 'green'  },
  prob:   { label: 'Prawdopodobieństwo', color: 'orange' },
  ec:     { label: 'Spójność',           color: 'blue'   },
};

const BLOCKS = {
  // events (triggers)
  'on-start':    { cat: 'events',  type: 'trigger',    label: '🟢 na start' },
  'on-tick':     { cat: 'events',  type: 'trigger',    label: '🕐 co tick' },
  'on-click-a':  { cat: 'events',  type: 'trigger',    label: '🅰 gdy klik A' },
  'on-click-b':  { cat: 'events',  type: 'trigger',    label: '🅱 gdy klik B' },
  'on-message':  { cat: 'events',  type: 'trigger',    label: '📡 gdy odebrano §msg na §ch', slots: { msg: { type: 'ident', default: '' }, ch: { type: 'number', default: 1 } } },
  // radio (msg can be a string OR an expression like stan.n)
  'broadcast':   { cat: 'radio',   type: 'statement',  label: '📢 nadaj §msg na §ch',          slots: { msg: { type: 'expression', default: 'hi' }, ch: { type: 'number', default: 1 } } },
  'last-msg':    { cat: 'radio',   type: 'expression', label: '📥 ostatnia wiadomość' },
  'set-channel': { cat: 'radio',   type: 'statement',  label: '🎯 ustaw kanał §ch',            slots: { ch: { type: 'number', default: 1 } } },
  // display (5x5 LED grid; coords 0..4)
  'led-on':      { cat: 'display', type: 'statement',  label: '💡 zapal (§x, §y)',             slots: { x: { type: 'number', default: 2 }, y: { type: 'number', default: 2 } } },
  'led-off':     { cat: 'display', type: 'statement',  label: '🌑 zgaś (§x, §y)',              slots: { x: { type: 'number', default: 2 }, y: { type: 'number', default: 2 } } },
  'screen-fill': { cat: 'display', type: 'statement',  label: '🎨 cały ekran §c',              slots: { c: { type: 'choice', options: ['1','0'], default: '1' } } },
  'show-num':    { cat: 'display', type: 'statement',  label: '📃 pokaż liczbę §n',            slots: { n: { type: 'expression', default: 0 } } },
  // state
  'set-state':   { cat: 'state',   type: 'statement',  label: 'stan.§field = §val',            slots: { field: { type: 'ident', default: 'x' }, val: { type: 'expression', default: 0 } } },
  'get-state':   { cat: 'state',   type: 'expression', label: 'stan.§field',                   slots: { field: { type: 'ident', default: 'x' } } },
  // flow / math
  'num':         { cat: 'flow',    type: 'expression', label: '§n',                            slots: { n: { type: 'number', default: 0 } } },
  'op':          { cat: 'flow',    type: 'expression', label: '(§a §op §b)',                   slots: { a: { type: 'expression', default: 0 }, op: { type: 'choice', options: ['+','-','*','/','%','max','min'], default: '+' }, b: { type: 'expression', default: 0 } } },
};

const CATEGORIES = {
  events:  { label: 'Zdarzenia',   color: 'green'  },
  radio:   { label: 'Radio',       color: 'cyan'   },
  display: { label: 'Wyświetlacz', color: 'pink'   },
  state:   { label: 'Stan',        color: 'blue'   },
  flow:    { label: 'Przepływ',    color: 'orange' },
};

const CHALLENGES = {
  msgs: [],
  prob: [],
  ec:   [],
};

CHALLENGES.msgs = [
  // 1) Cześć! — first broadcast & receive. Kid fills the receiver's
  //    channel and message in the on-message trigger.
  {
    title: 'Cześć!',
    type: 'fill-in-blank',
    goal: 'Urządzenie A nadaje wiadomość "hi" co tick na kanale 1. Niech B odbierze ją i zapali środkowy piksel (2, 2). Wypełnij dziury w bloku "gdy odebrano".',
    initialDevices: [
      { name: 'A', channel: 1, script: [
        { id: 'on-tick', body: [{ id: 'broadcast', slots: { msg: 'hi', ch: 1 } }] },
      ]},
      { name: 'B', channel: 1, script: [
        { id: 'on-message', slots: { msg: null, ch: null }, body: [
          { id: 'led-on', slots: { x: 2, y: 2 } },
        ]},
      ]},
    ],
    tests: [
      { t: 3, label: 'B odebrał "hi"',           assert: "d1.lastMsg === 'hi'" },
      { t: 3, label: 'B zapalił środek (2,2)',   assert: 'd1.display[12] === 1' },
    ],
  },

  // 2) Inny kanał — B starts subscribed to ch.2 (wrong) but receives ch.1
  //    in its on-message handler. The fix is to set its listening channel
  //    to 1 in on-start. Kid fills the channel number.
  {
    title: 'Inny kanał',
    type: 'fill-in-blank',
    goal: 'A nadaje co tick na kanale 1, ale B słucha na kanale 2 i nie odbiera. Wypełnij blok "ustaw kanał" w bloku "na start" urządzenia B, żeby B zaczęło słuchać tego samego kanału co A.',
    initialDevices: [
      { name: 'A', channel: 1, script: [
        { id: 'on-tick', body: [{ id: 'broadcast', slots: { msg: 'go', ch: 1 } }] },
      ]},
      { name: 'B', channel: 2, script: [
        { id: 'on-start',   body: [{ id: 'set-channel', slots: { ch: null } }] },
        { id: 'on-message', slots: { msg: 'go', ch: 1 }, body: [
          { id: 'led-on', slots: { x: 2, y: 2 } },
        ]},
      ]},
    ],
    tests: [

// Helpers — chapter-3 challenges share repetitive gossip scaffolds, easier
// to read when factored out.
function makeGossipDevice(name) {
  const incExpr = () => ({ id: 'set-state', slots: { field: 'n', val:
    { id: 'op', slots: { a: { id: 'get-state', slots: { field: 'n' } }, op: '+', b: 1 } } } });
  return { name, channel: 1, script: [
    { id: 'on-tick', body: [
      incExpr(),
      { id: 'broadcast', slots: { msg: { id: 'get-state', slots: { field: 'n' } }, ch: 1 } },
    ]},
    { id: 'on-message', slots: { msg: '', ch: 1 }, body: [
      { id: 'set-state', slots: { field: 'n', val:
        { id: 'op', slots: { a: { id: 'get-state', slots: { field: 'n' } }, op: null, b: { id: 'last-msg' } } } } },
    ]},
  ]};
}
function makeGossipTrio() { return [makeGossipDevice('A'), makeGossipDevice('B'), makeGossipDevice('C')]; }
function makeTeam(leader, follower, ch) {
  // Leader counts ticks and broadcasts its current total. Follower copies
  // whatever it last received. Wrong broadcast channel ⇒ follower never
  // hears the leader and stays at 0 (the test failure mode for #12).
  return [
    { name: leader, channel: ch, script: [
      { id: 'on-tick', body: [
        { id: 'set-state', slots: { field: 'n', val:
          { id: 'op', slots: { a: { id: 'get-state', slots: { field: 'n' } }, op: '+', b: 1 } } } },
        { id: 'broadcast', slots: { msg: { id: 'get-state', slots: { field: 'n' } }, ch: null } },
      ]},
    ]},
    { name: follower, channel: ch, script: [
      { id: 'on-message', slots: { msg: '', ch: ch }, body: [
        { id: 'set-state', slots: { field: 'n', val: { id: 'last-msg' } } },
      ]},
    ]},
  ];
}
function makeTwoTeams() {
  return [...makeTeam('A', 'B', 1), ...makeTeam('C', 'D', 2)];
}

const STATE = { view: 'tree-view', stage: null, challenge: null, activeDevice: 0, deviceScripts: [] };
// STATE.script aliases the active device's script so the existing block engine
// (renderScript, tryPlaceBlock, openSlotEditor, ...) keeps working unchanged.
Object.defineProperty(STATE, 'script', {
  get() { return this.deviceScripts[this.activeDevice] || []; },
  set(v) { this.deviceScripts[this.activeDevice] = v; },
});
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  STATE.view = id;
}

function progress() {
  try { return JSON.parse(localStorage.getItem('radioroom-progress') || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem('radioroom-progress', JSON.stringify(p)); }

function saveCurrentScript() {
  if (!STATE.stage || STATE.challenge == null) return;
  try {
    const all = JSON.parse(localStorage.getItem('radioroom-scripts') || '{}');
    all[STATE.stage] = all[STATE.stage] || {};
    all[STATE.stage][STATE.challenge] = STATE.deviceScripts;
    localStorage.setItem('radioroom-scripts', JSON.stringify(all));
  } catch (e) { console.warn('save script failed:', e); }
}
function loadSavedScript(stageId, idx) {
  try {
    const all = JSON.parse(localStorage.getItem('radioroom-scripts') || '{}');
    const s = all?.[stageId]?.[idx];
    return Array.isArray(s) ? s : null;
  } catch { return null; }
}
// Tag nodes with `_blanks`: slot keys that were originally null in initialScript.
// These remain editable in fill-in-blank mode even after the user fills them in.
function markBlanks(loaded, original) {
  if (!Array.isArray(loaded) || !Array.isArray(original)) return;
  const len = Math.min(loaded.length, original.length);
  for (let i = 0; i < len; i++) {
    const ln = loaded[i], on = original[i];
    if (!ln || !on) continue;
    const slots = on.slots || {};
    const blanks = Object.keys(slots).filter(k => slots[k] === null);
    if (blanks.length) ln._blanks = blanks;
    if (Array.isArray(on.body)) markBlanks(ln.body, on.body);
  }
}
function stageProgress(id) { return progress()[id] || { stars: [] }; }
function isStageComplete(id) {
  const p = stageProgress(id);
  const earned = (p.stars || []).filter(s => s > 0).length;
  return earned >= 3;
}
function isStageAvailable(id) {
  const stage = STAGES.find(s => s.id === id);
  return stage.requires.every(r => isStageComplete(r));
}

function renderTree() {
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  const byTrack = {};
  STAGES.forEach(s => { (byTrack[s.track] ||= []).push(s); });
  Object.entries(byTrack).forEach(([trackId, stages]) => {
    const meta = TRACKS[trackId];
    const label = document.createElement('div');
    label.className = `tree-track-label ${meta.color}`;
    label.textContent = meta.label;
    root.appendChild(label);
    stages.forEach((s, i) => {
      if (i > 0) {
        const c = document.createElement('div');
        c.className = 'tree-connector';
        root.appendChild(c);
      }
      const complete = isStageComplete(s.id);
      const available = isStageAvailable(s.id);
      const locked = !complete && !available;
      const p = stageProgress(s.id);
      const node = document.createElement('div');
      node.className = `tree-node t-${meta.color} ${complete ? 'complete' : available ? 'available' : 'locked'}`;
      node.innerHTML = `
        <div class="node-icon">${s.icon}</div>
        <div class="node-title">${s.title}</div>
        <div class="node-desc">${s.desc}</div>
      `;
      const chList = CHALLENGES[s.id] || [];
      const earned = (p.stars || []).reduce((a, b) => a + (b || 0), 0);
      const total = chList.length * 3;
      const starsLine = document.createElement('div');
      starsLine.className = 'node-stars';
      starsLine.textContent = `⭐ ${earned}/${total}`;
      node.appendChild(starsLine);
      if (!locked) node.addEventListener('click', () => openStage(s.id));
      root.appendChild(node);
    });
  });
}
function openStage(id) {
  STATE.stage = id;
  const stage = STAGES.find(s => s.id === id);
  const list = CHALLENGES[id] || [];
  const p = stageProgress(id);
  const el = document.getElementById('browser-view');
  el.innerHTML = `
    <div class="browser-header">
      <button class="back" onclick="ps.backToTree()">← drzewo</button>
      <h2>${stage.icon} ${stage.title}</h2>
    </div>
    <div id="challenge-list"></div>
  `;
  const listEl = el.querySelector('#challenge-list');
  list.forEach((ch, i) => {
    const stars = (p.stars && p.stars[i]) || 0;
    const starsHtml = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    const div = document.createElement('div');
    div.className = 'challenge-item';
    div.innerHTML = `
      <span class="ci-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="ci-title">${ch.title}</span>
      <span class="ci-stars">${starsHtml}</span>
    `;
    div.addEventListener('click', () => openChallenge(id, i));
    listEl.appendChild(div);
  });
  showView('browser-view');
}
function emptyScript() { return []; }

function appendLabelParts(parent, def, slots, opts, ownerNode) {
  const pattern = def.label;
  let cursor = 0;
  const re = /§(\w+)/g;
  let match;
  while ((match = re.exec(pattern)) !== null) {
    const before = pattern.slice(cursor, match.index);
    if (before) parent.appendChild(document.createTextNode(before));
    const key = match[1];
    const val = slots && key in slots ? slots[key] : def.slots?.[key]?.default ?? '';
    const slotEl = document.createElement('span');
    slotEl.className = 'slot';
    slotEl.dataset.slot = key;
    slotEl.__node = ownerNode; // every slot knows its owning node
    const isBlankKey = !!(ownerNode && Array.isArray(ownerNode._blanks) && ownerNode._blanks.includes(key));
    const locked = opts.lockLiterals && val !== null && val !== undefined && !(typeof val === 'object') && !isBlankKey;
    if (locked) slotEl.dataset.locked = '1';
    appendSlotContent(slotEl, val, opts);
    parent.appendChild(slotEl);
    cursor = re.lastIndex;
  }
  const rest = pattern.slice(cursor);
  if (rest) parent.appendChild(document.createTextNode(rest));
}

function appendSlotContent(parent, val, opts) {
  if (val === null || val === undefined) {
    const hole = document.createElement('span');
    hole.className = 'hole';
    hole.textContent = '?';
    parent.appendChild(hole);
    return;
  }
  if (val && typeof val === 'object' && val.id) {
    const def = BLOCKS[val.id];
    if (!def) { parent.appendChild(document.createTextNode('?')); return; }
    const nestedEl = document.createElement('span');
    nestedEl.className = `nested b-${def.cat}`;
    const nestedOpts = { ...opts, lockLiterals: false };
    appendLabelParts(nestedEl, def, val.slots || {}, nestedOpts, val);
    parent.appendChild(nestedEl);
    const x = document.createElement('span');
    x.className = 'btn-remove';
    x.textContent = '×';
    x.title = 'usuń';
    x.dataset.removeNested = '1';
    parent.appendChild(x);
    return;
  }
  parent.appendChild(document.createTextNode(String(val)));
}

function renderBlockEl(node, def, opts) {
  const bl = document.createElement('div');
  bl.className = `palette-block b-${def.cat}`;
  bl.__node = node;
  appendLabelParts(bl, def, node.slots || {}, opts, node);
  if (!opts.lockLiterals) {
    const x = document.createElement('span');
    x.className = 'btn-remove';
    x.textContent = '×';
    x.title = 'usuń blok';
    x.dataset.removeBlock = '1';
    bl.appendChild(x);
  }
  return bl;
}

function currentChallenge() {
  if (!STATE.stage || STATE.challenge == null) return null;
  return (CHALLENGES[STATE.stage] || [])[STATE.challenge] || null;
}
function isFillInMode() {
  const ch = currentChallenge();
  return !!(ch && ch.type === 'fill-in-blank');
}

function renderScript() {
  const el = document.getElementById('script-area');
  el.innerHTML = '';
  STATE.script = STATE.script || emptyScript();
  const opts = { lockLiterals: isFillInMode() };
  const movable = !opts.lockLiterals;
  STATE.script.forEach((trig, ti) => {
    const def = BLOCKS[trig.id];
    if (!def) return;
    const trigEl = renderBlockEl(trig, def, opts);
    trigEl.dataset.triggerIdx = ti;
    if (movable) trigEl.draggable = true;
    el.appendChild(trigEl);
    const body = document.createElement('div');
    body.className = 'script-body';
    body.dataset.role = 'body';
    body.dataset.triggerIdx = ti;
    body.style.cssText = 'margin-left:20px;border-left:2px solid var(--border);padding-left:10px;margin-bottom:8px;';
    (trig.body || []).forEach((n, si) => {
      const def2 = BLOCKS[n.id];
      if (!def2) return;
      const stmtEl = renderBlockEl(n, def2, opts);
      stmtEl.dataset.triggerIdx = ti;
      stmtEl.dataset.stmtIdx = si;
      if (movable) stmtEl.draggable = true;
      body.appendChild(stmtEl);
    });
    el.appendChild(body);
  });
  if (typeof applyTargetHighlights === 'function') applyTargetHighlights();
}

function renderPalette(cats) {
  const el = document.getElementById('palette');
  el.innerHTML = '';
  cats.forEach(catId => {
    const meta = CATEGORIES[catId];
    const group = document.createElement('div');
    group.className = 'palette-cat';
    group.innerHTML = `<div class="palette-cat-label">${meta.label}</div>`;
    Object.entries(BLOCKS).filter(([,b]) => b.cat === catId).forEach(([id, b]) => {
      const bl = document.createElement('div');
      bl.className = `palette-block b-${catId}`;
      bl.draggable = true;
      bl.dataset.blockId = id;
      bl.textContent = b.label.replace(/§\w+/g, '…');
      group.appendChild(bl);
    });
    el.appendChild(group);
  });
}

function openChallenge(stageId, idx) {
  STATE.stage = stageId;
  STATE.challenge = idx;
  const ch = (CHALLENGES[stageId] || [])[idx];
  if (!ch) { console.warn('no challenge'); return; }
  worldStop();
  document.getElementById('ch-title').textContent = ch.title;
  const stars = (stageProgress(stageId).stars || [])[idx] || 0;
  document.getElementById('ch-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('ch-goal').innerHTML = ch.goal || '';
  document.getElementById('ch-tests').innerHTML = (ch.tests || []).map((t, i) =>
    `<div class="t-pending" data-i="${i}">○ ${t.label || `test ${i+1}`}</div>`
  ).join('');
  document.getElementById('ch-msg').textContent = '';
  document.getElementById('ch-msg').className = 'ch-msg';
  // Per-device scripts. The challenge declares N devices in `initialDevices`.
  // We load saved scripts when present; otherwise seed from `init.script` (default empty).
  const inits = ch.initialDevices || [{ name: 'A', channel: 1 }];
  const saved = loadSavedScript(stageId, idx);
  STATE.deviceScripts = inits.map((init, i) => {
    if (saved && saved[i]) return JSON.parse(JSON.stringify(saved[i]));
    return JSON.parse(JSON.stringify(init.script || []));
  });
  // In fill-in-blank mode, tag slots that were originally null so they stay
  // editable even after the kid fills them in. Done per device.
  STATE.deviceScripts.forEach((sc, i) => markBlanks(sc, inits[i].script || []));
  STATE.activeDevice = 0;
  // Wire WORLD with editable copies so renderDevices can paint them straight away.
  worldReset(inits.map((init, i) => ({ ...init, script: STATE.deviceScripts[i] })));
  renderDevices();
  renderScript();
  const stage = STAGES.find(s => s.id === stageId);
  renderPalette(stage.unlockedCats);
  showView('challenge-view');
}
function backToStage() { openStage(STATE.stage); }
function backToTree() { worldStop(); showView('tree-view'); renderTree(); }

function makeDefaultSlots(def) {
  const out = {};
  Object.entries(def.slots || {}).forEach(([k, s]) => { out[k] = s.default; });
  return out;
}

document.addEventListener('dragstart', e => {
  const t = e.target.closest && e.target.closest('.palette-block');
  if (!t) return;
  // Palette item — copy a fresh block into the script
  if (t.dataset.blockId) {
    if (!(t.closest('#palette') || t.closest('#sb-palette'))) return;
    if (typeof clearPaletteSelection === 'function') clearPaletteSelection();
    e.dataTransfer.setData('text/block-id', t.dataset.blockId);
    e.dataTransfer.effectAllowed = 'copy';
    return;
  }
  // Script-area block — move existing node within the script
  if (t.dataset.triggerIdx === undefined) return;
  const ctx = getActiveScriptContext(e);
  if (!ctx) return;
  if (isFillInForContext(ctx.scriptOwner)) return;
  e.dataTransfer.setData('text/script-move', JSON.stringify({
    owner: ctx.scriptOwner,
    ti: Number(t.dataset.triggerIdx),
    si: t.dataset.stmtIdx !== undefined ? Number(t.dataset.stmtIdx) : null,
  }));
  e.dataTransfer.effectAllowed = 'move';
});

function getActiveScriptContext(e) {
  const root = e.target.closest && e.target.closest('#script-area');
  if (!root) return null;
  return { root, scriptOwner: 'challenge' };
}
function getActiveScript(ownerKey) {
  if (ownerKey === 'challenge') return STATE.script;
  return null;
}
function rerenderScript(ownerKey) {
  if (ownerKey === 'challenge') { renderScript(); saveCurrentScript(); }
}
function isFillInForContext(ownerKey) {
  return ownerKey === 'challenge' && isFillInMode();
}

// Place a fresh palette block at a click/drop target. Returns true if it landed.
// Shared by drag-and-drop and click-to-place flows.
function tryPlaceBlock(id, targetEl, ctx, opts = {}) {
  const def = BLOCKS[id]; if (!def) return false;
  const script = getActiveScript(ctx.scriptOwner);
  if (!script && ctx.scriptOwner === 'sandbox') return false;

  if (def.type === 'expression') {
    const slot = targetEl.closest('.slot');
    if (!slot || slot.dataset.locked === '1') return false;
    const node = slot.__node; if (!node) return false;
    const slotKey = slot.dataset.slot;
    const parentDef = BLOCKS[node.id];
    const slotDef = parentDef && parentDef.slots && parentDef.slots[slotKey];
    if (!slotDef || slotDef.type !== 'expression') return false;
    node.slots = node.slots || {};
    node.slots[slotKey] = { id, slots: makeDefaultSlots(def) };
    rerenderScript(ctx.scriptOwner);
    return true;
  }

  // Trigger / statement — disabled in fill-in-blank challenge mode
  if (isFillInForContext(ctx.scriptOwner)) return false;
  const targetBody = targetEl.closest('[data-role="body"]');
  const defaults = makeDefaultSlots(def);
  if (def.type === 'trigger') {
    if (targetBody) { if (opts.alert) alert('Trigger nie może być w ciele innego triggera.'); return false; }
    script.push({ id, slots: defaults, body: [] });
  } else if (def.type === 'statement') {
    if (!targetBody) { if (opts.alert) alert('Przeciągnij blok do ciała triggera (obszar z lewym paskiem).'); return false; }
    const ti = Number(targetBody.dataset.triggerIdx);
    script[ti].body.push({ id, slots: defaults });
  } else {
    return false;
  }
  rerenderScript(ctx.scriptOwner);
  return true;
}

document.body.addEventListener('dragover', e => {
  if (!getActiveScriptContext(e)) return;
  const types = e.dataTransfer.types;
  const isBlockDrag = types.includes('text/block-id') || types.includes('text/script-move');
  if (!isBlockDrag) return;
  e.preventDefault();
  const target = e.target.closest('.slot, [data-role="body"]');
  document.querySelectorAll('.dragover').forEach(el => { if (el !== target) el.classList.remove('dragover'); });
  if (target && target.dataset.locked !== '1') target.classList.add('dragover');
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragover').forEach(el => el.classList.remove('dragover')));

document.body.addEventListener('drop', e => {
  const ctx = getActiveScriptContext(e); if (!ctx) return;
  e.preventDefault();
  document.querySelectorAll('.dragover').forEach(el => el.classList.remove('dragover'));
  const moveRaw = e.dataTransfer.getData('text/script-move');
  if (moveRaw) { handleScriptMove(e, ctx, moveRaw); return; }
  const id = e.dataTransfer.getData('text/block-id');
  if (!id) return;
  tryPlaceBlock(id, e.target, ctx, { alert: true });
});

// Reorder a block already in the script. Statements move within / between bodies;
// triggers move at the top level. Insertion position uses the mouse Y vs the
// nearest sibling block's midpoint (upper half = before, lower half = after).
function handleScriptMove(e, ctx, raw) {
  if (isFillInForContext(ctx.scriptOwner)) return;
  let src; try { src = JSON.parse(raw); } catch { return; }
  if (!src || src.owner !== ctx.scriptOwner) return;
  const script = getActiveScript(ctx.scriptOwner);
  if (!script) return;
  const isStatement = src.si !== null && src.si !== undefined;
  if (isStatement) {
    const sourceArr = script[src.ti] && script[src.ti].body;
    const node = sourceArr && sourceArr[src.si];
    if (!node) return;
    const targetBody = e.target.closest('[data-role="body"]');
    if (!targetBody) return;
    const targetTi = Number(targetBody.dataset.triggerIdx);
    const targetArr = script[targetTi] && script[targetTi].body;
    if (!targetArr) return;
    let insertAt = targetArr.length;
    const sib = e.target.closest('.palette-block');
    if (sib && sib.parentElement === targetBody && sib.dataset.stmtIdx !== undefined) {
      const r = sib.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      insertAt = Number(sib.dataset.stmtIdx) + (before ? 0 : 1);
    }
    sourceArr.splice(src.si, 1);
    if (sourceArr === targetArr && src.si < insertAt) insertAt -= 1;
    targetArr.splice(insertAt, 0, node);
  } else {
    if (e.target.closest('[data-role="body"]')) return;
    const node = script[src.ti];
    if (!node) return;
    let insertAt = script.length;
    const sib = e.target.closest('.palette-block');
    if (sib && sib.dataset.triggerIdx !== undefined && sib.dataset.stmtIdx === undefined) {
      const r = sib.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      insertAt = Number(sib.dataset.triggerIdx) + (before ? 0 : 1);
    }
    script.splice(src.ti, 1);
    if (src.ti < insertAt) insertAt -= 1;
    script.splice(insertAt, 0, node);
  }
  rerenderScript(ctx.scriptOwner);
}

// Click-to-place: arm a palette block by clicking it, then click a target.
// Clean clicks (no drag) fire `click`; drags don't, so the two interactions don't collide.
function selectPalette(id) {
  STATE.selectedPaletteId = id;
  document.querySelectorAll('.palette-block.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`.palette-block[data-block-id="${id}"]`).forEach(el => el.classList.add('selected'));
  applyTargetHighlights();
}
function clearPaletteSelection() {
  STATE.selectedPaletteId = null;
  document.querySelectorAll('.palette-block.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.target').forEach(el => el.classList.remove('target'));
}
function applyTargetHighlights() {
  document.querySelectorAll('.target').forEach(el => el.classList.remove('target'));
  const id = STATE.selectedPaletteId; if (!id) return;
  const def = BLOCKS[id]; if (!def) return;
  ['script-area', 'sb-script-area'].forEach(rid => {
    const r = document.getElementById(rid); if (!r) return;
    const owner = rid === 'script-area' ? 'challenge' : 'sandbox';
    if (def.type === 'expression') {
      r.querySelectorAll('.slot').forEach(slot => {
        if (slot.dataset.locked === '1') return;
        const node = slot.__node; if (!node) return;
        const parentDef = BLOCKS[node.id];
        const slotDef = parentDef && parentDef.slots && parentDef.slots[slot.dataset.slot];
        if (slotDef && slotDef.type === 'expression') slot.classList.add('target');
      });
    } else if (def.type === 'statement' && !isFillInForContext(owner)) {
      r.querySelectorAll('[data-role="body"]').forEach(b => b.classList.add('target'));
    }
  });
}

document.addEventListener('click', e => {
  const pb = e.target.closest('.palette-block');
  if (pb && pb.dataset.blockId && (pb.closest('#palette') || pb.closest('#sb-palette'))) {
    if (STATE.selectedPaletteId === pb.dataset.blockId) clearPaletteSelection();
    else selectPalette(pb.dataset.blockId);
    return;
  }
  // Click outside palette/script-area while armed → cancel
  if (STATE.selectedPaletteId && !e.target.closest('#script-area, #sb-script-area')) {
    clearPaletteSelection();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && STATE.selectedPaletteId) clearPaletteSelection();
});

document.body.addEventListener('click', e => {
  const ctx = getActiveScriptContext(e); if (!ctx) return;
  // Remove buttons take priority over everything else.
  const xBtn = e.target.closest('.btn-remove');
  if (xBtn) {
    e.stopPropagation();
    if (xBtn.dataset.removeNested) {
      const slot = xBtn.closest('.slot');
      const node = slot && slot.__node;
      const slotKey = slot && slot.dataset.slot;
      if (!node || !slotKey) return;
      const def = BLOCKS[node.id];
      const slotDef = def && def.slots && def.slots[slotKey];
      const isBlank = !!(node._blanks && node._blanks.includes(slotKey));
      node.slots[slotKey] = isBlank ? null : (slotDef ? slotDef.default : 0);
      rerenderScript(ctx.scriptOwner);
      return;
    }
    if (xBtn.dataset.removeBlock) {
      if (isFillInForContext(ctx.scriptOwner)) return;
      const block = xBtn.closest('.palette-block');
      const target = block && block.__node;
      const script = getActiveScript(ctx.scriptOwner);
      if (!target || !script) return;
      removeNodeFrom(script, target);
      rerenderScript(ctx.scriptOwner);
      return;
    }
    return;
  }
  // Armed selection: place at target if click is on one, then disarm.
  if (STATE.selectedPaletteId) {
    const onTarget = e.target.closest('.target');
    if (onTarget) tryPlaceBlock(STATE.selectedPaletteId, e.target, ctx);
    clearPaletteSelection();
    return;
  }
  // Click landed on an existing editor — let it handle its own click (esp. native color picker).
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const slotEl = e.target.closest('.slot');
  if (!slotEl) return;
  if (slotEl.dataset.locked === '1') return;
  const node = slotEl.__node;
  if (!node) return;
  const def = BLOCKS[node.id];
  const slotKey = slotEl.dataset.slot;
  const slotDef = def.slots?.[slotKey];
  if (!slotDef) return;
  // nested block in slot — not a literal, skip (right-click to revert)
  const cur = node.slots ? node.slots[slotKey] : undefined;
  if (cur && typeof cur === 'object') return;
  openSlotEditor(slotEl, node, slotKey, slotDef, ctx.scriptOwner);
});

function openSlotEditor(slotEl, node, key, def, ownerKey = 'challenge') {
  const cur = node.slots ? node.slots[key] : def.default;
  if (def.type === 'color') {
    openColorSlotEditor(slotEl, node, key, cur, ownerKey);
    return;
  }
  let input;
  if (def.type === 'choice') {
    input = document.createElement('select');
    def.options.forEach(o => {
      const opt = document.createElement('option'); opt.value = o; opt.textContent = o;
      if (o === cur) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = document.createElement('input'); input.type = 'text'; input.value = cur;
  }
  input.style.cssText = 'font-family:var(--mono);font-size:12px;padding:2px 6px;width:90px;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:4px;';
  slotEl.innerHTML = '';
  slotEl.appendChild(input);
  input.focus();
  if (input.select) try { input.select(); } catch {}
  const commit = () => {
    let v = input.value;
    if (def.type === 'number') v = Number(v);
    else if (def.type === 'expression') v = isNaN(Number(v)) || v === '' ? v : Number(v);
    if (!node.slots) node.slots = {};
    node.slots[key] = v;
    rerenderScript(ownerKey);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') { ev.preventDefault(); rerenderScript(ownerKey); } });
}

// Color editor: hex text field (works on every browser) plus a native swatch picker.
// They stay in sync; commit when focus leaves the wrapper entirely.
function openColorSlotEditor(slotEl, node, key, cur, ownerKey) {
  const valid = /^#[0-9a-fA-F]{6}$/;
  const initial = valid.test(String(cur || '')) ? String(cur) : '#000000';
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:inline-flex;gap:4px;align-items:center;';
  const text = document.createElement('input');
  text.type = 'text';
  text.value = initial;
  text.maxLength = 7;
  text.spellcheck = false;
  text.style.cssText = 'font-family:var(--mono);font-size:12px;padding:2px 6px;width:80px;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:4px;';
  const swatch = document.createElement('input');
  swatch.type = 'color';
  swatch.value = initial;
  swatch.style.cssText = 'width:24px;height:24px;padding:0;border:1px solid var(--border2);border-radius:4px;background:none;cursor:pointer;';
  wrap.appendChild(text);
  wrap.appendChild(swatch);
  slotEl.innerHTML = '';
  slotEl.appendChild(wrap);
  text.focus();
  try { text.select(); } catch {}
  text.addEventListener('input', () => { if (valid.test(text.value)) swatch.value = text.value; });
  const fromSwatch = () => { text.value = swatch.value; };
  swatch.addEventListener('input', fromSwatch);
  swatch.addEventListener('change', fromSwatch);
  let done = false;
  const commit = () => {
    if (done) return;
    done = true;
    let v = text.value.trim();
    if (!valid.test(v)) v = swatch.value;
    if (!node.slots) node.slots = {};
    node.slots[key] = v;
    rerenderScript(ownerKey);
  };
  wrap.addEventListener('focusout', () => {
    setTimeout(() => {
      if (!wrap.isConnected) return;
      if (!wrap.contains(document.activeElement)) commit();
    }, 0);
  });
  text.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); text.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); done = true; rerenderScript(ownerKey); }
  });
}

document.body.addEventListener('contextmenu', e => {
  const ctx = getActiveScriptContext(e); if (!ctx) return;
  // Right-click on a slot that currently holds a nested expression → revert to default literal.
  const slot = e.target.closest('.slot');
  if (slot && slot.dataset.locked !== '1') {
    const node = slot.__node;
    if (node) {
      const slotKey = slot.dataset.slot;
      const cur = node.slots ? node.slots[slotKey] : undefined;
      if (cur && typeof cur === 'object') {
        e.preventDefault();
        const def = BLOCKS[node.id];
        const slotDef = def && def.slots && def.slots[slotKey];
        node.slots[slotKey] = slotDef ? slotDef.default : 0;
        rerenderScript(ctx.scriptOwner);
        return;
      }
    }
  }
  // Block-level removal (not allowed in fill-in-blank challenge mode).
  if (isFillInForContext(ctx.scriptOwner)) return;
  const block = e.target.closest('.palette-block');
  if (!block || !block.__node) return;
  e.preventDefault();
  if (!confirm('Usunąć ten blok?')) return;
  const script = getActiveScript(ctx.scriptOwner);
  if (!script) return;
  removeNodeFrom(script, block.__node);
  rerenderScript(ctx.scriptOwner);
});

function removeNodeFrom(script, target) {
  for (let ti = 0; ti < script.length; ti++) {
    const trig = script[ti];
    if (trig === target) { script.splice(ti, 1); return; }
    const bi = (trig.body || []).indexOf(target);
    if (bi >= 0) { trig.body.splice(bi, 1); return; }
  }
}

function makeDevice(opts = {}) {
  return {
    name: opts.name || 'A',
    channel: opts.channel ?? 1,
    state: {},
    display: Array(25).fill(0),  // 5x5 LED grid; index = y*5 + x
    script: opts.script || [],
    inbox: [],                   // recently received messages (most recent first)
    lastMsg: '',
    _started: false,
  };
}

function evalExpr(node, ctx) {
  if (node == null) return 0;
  if (typeof node === 'number') return node;
  if (typeof node === 'string') {
    if (node !== '' && !isNaN(Number(node))) return Number(node);
    return node;
  }
  const def = BLOCKS[node.id];
  if (!def) return 0;
  switch (node.id) {
    case 'num':       return Number(node.slots.n);
    case 'op': {
      const a = Number(evalExpr(node.slots.a, ctx));
      const b = Number(evalExpr(node.slots.b, ctx));
      switch (node.slots.op) {
        case '+':   return a + b;
        case '-':   return a - b;
        case '*':   return a * b;
        case '/':   return b === 0 ? 0 : a / b;
        case '%':   return b === 0 ? 0 : a % b;
        case 'max': return Math.max(a, b);
        case 'min': return Math.min(a, b);
      }
      return 0;
    }
    case 'get-state': return ctx.device.state[node.slots.field] ?? 0;
    case 'last-msg':  return ctx.device.lastMsg ?? '';
  }
  return 0;
}

function runStatement(node, ctx) {
  const d = ctx.device;
  switch (node.id) {
    case 'set-state': d.state[node.slots.field] = evalExpr(node.slots.val, ctx); break;
    case 'led-on': {
      const x = Math.max(0, Math.min(4, Number(evalExpr(node.slots.x, ctx)) | 0));
      const y = Math.max(0, Math.min(4, Number(evalExpr(node.slots.y, ctx)) | 0));
      d.display[y * 5 + x] = 1;
      break;
    }
    case 'led-off': {
      const x = Math.max(0, Math.min(4, Number(evalExpr(node.slots.x, ctx)) | 0));
      const y = Math.max(0, Math.min(4, Number(evalExpr(node.slots.y, ctx)) | 0));
      d.display[y * 5 + x] = 0;
      break;
    }
    case 'screen-fill': d.display.fill(node.slots.c === '1' ? 1 : 0); break;
    case 'show-num':    d.state.__shown = Number(evalExpr(node.slots.n, ctx)); break;
    case 'set-channel': d.channel = Math.max(1, Math.min(9, Number(evalExpr(node.slots.ch, ctx)) | 0)); break;
    case 'broadcast': {
      // null ch = "blank, kid hasn't filled it" → skip the broadcast entirely
      // (matches on-message's null = unfilled rule). Without this, a null ch
      // would coerce to 0 and clamp to 1, masking unsolved fill-in-blanks.
      const chRaw = node.slots.ch;
      if (chRaw === null || chRaw === undefined) break;
      // msg slot accepts a literal string or any expression (e.g. stan.n).
      // Evaluate the expression — strings stay strings, numbers come back as
      // numbers. Either kind survives in the bus payload.
      const raw = node.slots.msg;
      let msg;
      if (raw === null || raw === undefined) msg = '';
      else if (typeof raw === 'object' && raw.id) msg = evalExpr(raw, ctx);
      else msg = raw;
      const ch  = Math.max(1, Math.min(9, Number(evalExpr(chRaw, ctx)) | 0));
      tryBroadcast(d, msg, ch);
      break;
    }
  }
}

function runBody(body, ctx) { for (const n of body || []) runStatement(n, ctx); }

function runTrigger(trigId, device) {
  const ctx = { device };
  for (const trig of device.script) {
    if (trig.id === trigId) runBody(trig.body, ctx);
  }
}

// Seedable PRNG (mulberry32). Lessons that compare observed to configured
// drop rate need a deterministic mode; setSeed switches it on/off.
function mulberry32(seed) {
  let s = (seed | 0) >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function setSeed(seed) {
  WORLD.knobs.seed = (seed === '' || seed == null) ? null : (Number(seed) | 0);
  WORLD.rng = WORLD.knobs.seed === null ? Math.random : mulberry32(WORLD.knobs.seed);
}

// Channel palette. ch.0 unused; ch.1..9 are the real radio channels.
const CHANNEL_COLORS = ['', '#00ddff', '#ff55ff', '#ffaa00', '#00ff88', '#4488ff', '#ff8acc', '#ff6e00', '#bb66ff', '#ff5555'];

// Schedule one delivery per (sender → receiver) pair. Each link rolls its
// own drop dice and gets its own jittered delay — that's how real radio
// works (per-link reliability), and it makes observed drop% match the knob.
let __busSeq = 0;
function tryBroadcast(fromDev, msg, channel) {
  const dropChance = (WORLD.knobs.dropPct || 0) / 100;
  const delayMs    = WORLD.knobs.delayMs || 0;
  const jitter     = WORLD.knobs.jitter ?? 0.5;
  const TICK_MS    = 1000 / 30;
  const nowMs = performance.now();
  for (const d of WORLD.devices) {
    if (d === fromDev) continue;
    if (d.channel !== channel) continue;
    const j = 1 + (WORLD.rng() * 2 - 1) * jitter;
    const actualDelayMs = Math.max(0, delayMs * j);
    const delayTicks = Math.max(0, Math.round(actualDelayMs / TICK_MS));
    const dropped = WORLD.rng() < dropChance;
    const roll = Math.floor(WORLD.rng() * 10);  // d10 face for the dice flash
    const entry = {
      id: ++__busSeq, from: fromDev, to: d, channel, msg,
      sentAt: WORLD.tick, deliverAt: WORLD.tick + delayTicks, dropped,
      // Visual fields (parallel timeline in real ms).
      fromIdx: WORLD.devices.indexOf(fromDev),
      toIdx:   WORLD.devices.indexOf(d),
      msSent: nowMs, msDeliver: nowMs + actualDelayMs,
      msFinish: 0, fxState: 'flying', diceRoll: roll, diceShown: false,
    };
    WORLD.bus.push(entry);
    WORLD.fx.push(entry);
    const s = WORLD.stats[channel] = WORLD.stats[channel] || { sent: 0, delivered: 0, dropped: 0 };
    s.sent++;
  }
}

function deliverDueMessages() {
  // Cascade loop: when an `on-message` handler broadcasts a same-tick reply
  // (delay=0), that reply must deliver in this tick too — otherwise simple
  // ping/pong scenarios need an extra tick to converge. Bounded for safety.
  let safety = 64;
  while (safety-- > 0) {
    if (WORLD.bus.length === 0) return;
    const due = [], remaining = [];
    for (const m of WORLD.bus) (m.deliverAt <= WORLD.tick ? due : remaining).push(m);
    if (due.length === 0) return;
    WORLD.bus = remaining;
    // Reorder OFF: respect send order. Reorder ON: leave whatever order
    // jitter produced (later-sent messages can deliver earlier).
    if (!WORLD.knobs.reorder) due.sort((a, b) => a.sentAt - b.sentAt);
    const nowMs = performance.now();
    for (const m of due) {
      const s = WORLD.stats[m.channel];
      if (m.dropped) {
        if (s) s.dropped++;
        m.fxState = 'dropped';
        m.msFinish = nowMs + 250;
        continue;
      }
      if (s) s.delivered++;
      m.fxState = 'delivered';
      m.msFinish = nowMs + 200;
      m.to.lastMsg = m.msg;
      m.to.inbox.unshift({ msg: m.msg, channel: m.channel, from: m.from.name, at: WORLD.tick });
      if (m.to.inbox.length > 16) m.to.inbox.length = 16;
      runMessageHandlers(m.to, m.msg, m.channel);
    }
  }
}

function runMessageHandlers(d, msg, channel) {
  const ctx = { device: d };
  for (const trig of d.script) {
    if (trig.id !== 'on-message') continue;
    const expectMsg = trig.slots && trig.slots.msg;
    const expectCh  = trig.slots && trig.slots.ch;
    // null = "blank, kid hasn't filled this in" → handler doesn't fire,
    // so unfilled fill-in-blank challenges fail their tests as expected.
    // '' (empty string default) still means "match any" for free-form use.
    if (expectMsg === null || expectMsg === undefined) continue;
    if (expectCh  === null || expectCh  === undefined) continue;
    // Coerce both sides to string for comparison. Broadcasts can carry
    // numbers (e.g. broadcasting stan.n), but kids type strings in the
    // on-message msg slot.
    if (expectMsg !== '' && String(expectMsg) !== String(msg)) continue;
    if (Number(expectCh) !== channel) continue;
    runBody(trig.body, ctx);
  }
}

const WORLD = {
  devices: [],
  bus: [],     // pending deliveries (live); pruned at delivery
  fx: [],      // visual queue (mirrors bus, kept ~200ms after delivery for fade)
  stats: {},   // per-channel { sent, delivered, dropped }
  knobs: { dropPct: 0, delayMs: 0, jitter: 0.5, reorder: false, seed: null },
  rng: Math.random,
  running: false, tick: 0, raf: 0,
};

function worldReset(devices) {
  WORLD.devices = devices.map(d => ({
    ...d,
    _started: false,
    state: {},
    display: Array(25).fill(0),
    inbox: [],
    lastMsg: '',
  }));
  WORLD.bus = [];
  WORLD.fx = [];
  WORLD.stats = {};
  WORLD.tick = 0;
  setSeed(WORLD.knobs.seed);
  const rs = document.getElementById('radio-space');
  if (rs) rs.innerHTML = '';
  renderStats();
}

function worldStart() {
  if (WORLD.running) return;
  WORLD.running = true;
  let lastStep = 0;
  const TICK_MS = 1000 / 30;
  const loop = (now) => {
    if (!WORLD.running) return;
    if (now - lastStep >= TICK_MS) {
      try { stepOnce(); }
      catch (e) {
        worldStop();
        console.warn('RadioRoom runtime error:', e);
        const msg = document.getElementById('ch-msg');
        if (msg && STATE.view === 'challenge-view') {
          msg.className = 'ch-msg fail';
          msg.textContent = 'Błąd w skrypcie: ' + (e && e.message ? e.message : e);
        }
        return;
      }
      renderDevices();
      renderStats();
      lastStep = now;
    }
    renderRadioSpace(now);  // every frame, smooth dot animation
    WORLD.raf = requestAnimationFrame(loop);
  };
  WORLD.raf = requestAnimationFrame(loop);
}

function pruneFx(now) {
  WORLD.fx = WORLD.fx.filter(m => m.fxState === 'flying' || (m.msFinish && m.msFinish > now));
}

function getDeviceCenter(idx) {
  const tile = document.querySelector(`.device[data-device-idx="${idx}"]`);
  const rs = document.getElementById('radio-space');
  if (!tile || !rs) return null;
  const t = tile.getBoundingClientRect();
  const r = rs.getBoundingClientRect();
  return { x: t.left + t.width / 2 - r.left, y: t.top + t.height / 2 - r.top };
}

function renderRadioSpace(now) {
  const root = document.getElementById('radio-space');
  if (!root) return;
  pruneFx(now);
  const seen = new Set();
  for (const m of WORLD.fx) {
    seen.add(String(m.id));
    const from = getDeviceCenter(m.fromIdx);
    const to   = getDeviceCenter(m.toIdx);
    if (!from || !to) continue;
    let dot = root.querySelector(`.dot[data-fx-id="${m.id}"]`);
    if (!dot) {
      dot = document.createElement('div');
      dot.className = 'dot';
      dot.dataset.fxId = m.id;
      const color = CHANNEL_COLORS[m.channel] || '#ffffff';
      dot.style.color = color;
      dot.style.background = color;
      root.appendChild(dot);
    }
    if (!m.diceShown) {
      m.diceShown = true;
      const dice = document.createElement('div');
      dice.className = 'dice';
      dice.textContent = m.diceRoll;
      dice.style.left = from.x + 'px';
      dice.style.top  = (from.y - 22) + 'px';
      dice.style.color = m.dropped ? '#ff5566' : (CHANNEL_COLORS[m.channel] || '#fff');
      dice.style.borderColor = dice.style.color;
      root.appendChild(dice);
      // animate: pop in, drift up, fade out
      requestAnimationFrame(() => { dice.style.transition = 'opacity .18s, top .35s'; dice.style.opacity = '1'; });
      setTimeout(() => { dice.style.opacity = '0'; dice.style.top = (from.y - 38) + 'px'; }, 200);
      setTimeout(() => { dice.remove(); }, 700);
    }
    if (m.fxState === 'flying') {
      const span = m.msDeliver - m.msSent;
      const t = span > 0 ? Math.max(0, Math.min(1, (now - m.msSent) / span)) : 1;
      dot.style.left = (from.x + (to.x - from.x) * t) + 'px';
      dot.style.top  = (from.y + (to.y - from.y) * t) + 'px';
      dot.style.opacity = '1';
    } else if (m.fxState === 'delivered') {
      dot.style.left = to.x + 'px';
      dot.style.top  = to.y + 'px';
      dot.style.opacity = String(Math.max(0, (m.msFinish - now) / 200));
    } else if (m.fxState === 'dropped') {
      const span = m.msDeliver - m.msSent;
      const t = span > 0 ? Math.max(0, Math.min(1, (now - m.msSent) / span)) : 0.5;
      dot.style.left = (from.x + (to.x - from.x) * t) + 'px';
      dot.style.top  = (from.y + (to.y - from.y) * t) + 'px';
      dot.classList.add('dropped');
      dot.textContent = '✗';
      dot.style.opacity = String(Math.max(0, (m.msFinish - now) / 250));
    }
  }
  root.querySelectorAll('.dot[data-fx-id]').forEach(el => {
    if (!seen.has(el.dataset.fxId)) el.remove();
  });
}

function renderStats() {
  const el = document.getElementById('stats-panel');
  if (!el) return;
  const channels = Object.keys(WORLD.stats).map(Number).sort((a, b) => a - b);
  if (channels.length === 0) {
    el.innerHTML = '<div class="stats-panel-title">Statystyki</div><div style="color:var(--muted);font-size:11px">Brak ruchu na radiu.</div>';
    return;
  }
  let html = '<div class="stats-panel-title">Statystyki</div>';
  html += '<div class="stats-row head"><span>kan.</span><span>nadane</span><span>odebrane</span><span>%</span></div>';
  for (const ch of channels) {
    const s = WORLD.stats[ch];
    const rate = s.sent > 0 ? Math.round((s.delivered / s.sent) * 100) : 0;
    const color = CHANNEL_COLORS[ch] || '#ffffff';
    html += `<div class="stats-row"><span><span class="stats-channel-dot" style="background:${color}"></span>ch.${ch}</span><span>${s.sent}</span><span>${s.delivered}</span><span>${rate}%</span></div>`;
  }
  el.innerHTML = html;
}

function bindKnobs() {
  const drop = document.getElementById('knob-drop');
  const dropV = document.getElementById('knob-drop-val');
  if (drop) drop.addEventListener('input', () => { WORLD.knobs.dropPct = Number(drop.value); dropV.textContent = drop.value + '%'; });
  const delay = document.getElementById('knob-delay');
  const delayV = document.getElementById('knob-delay-val');
  if (delay) delay.addEventListener('input', () => { WORLD.knobs.delayMs = Number(delay.value); delayV.textContent = delay.value + 'ms'; });
  const ro = document.getElementById('knob-reorder');
  if (ro) ro.addEventListener('change', e => { WORLD.knobs.reorder = e.target.checked; });
  const seed = document.getElementById('knob-seed');
  if (seed) seed.addEventListener('change', e => { setSeed(e.target.value); });
}

function worldStop() { WORLD.running = false; cancelAnimationFrame(WORLD.raf); }

function stepOnce() {
  for (const d of WORLD.devices) {
    if (!d._started) { runTrigger('on-start', d); d._started = true; }
    runTrigger('on-tick', d);
  }
  // Deliver any messages whose delivery tick has arrived (after triggers
  // had a chance to enqueue more). With delay=0, delivery is same-tick.
  deliverDueMessages();
  WORLD.tick++;
}

function compileDevicesForChallenge() {
  if (!STATE.stage || STATE.challenge == null) return [makeDevice()];
  const ch = CHALLENGES[STATE.stage][STATE.challenge];
  if (!ch) return [makeDevice()];
  const inits = ch.initialDevices || [{ name: 'A', channel: 1 }];
  return inits.map((init, i) => {
    const script = (STATE.deviceScripts && STATE.deviceScripts[i]) || init.script || [];
    return makeDevice({ ...init, script });
  });
}

function runHeadless(maxTicks, devices) {
  worldReset(devices);
  try {
    for (let i = 0; i < maxTicks; i++) stepOnce();
    if (maxTicks === 0) {
      for (const d of WORLD.devices) {
        if (!d._started) { runTrigger('on-start', d); d._started = true; }
      }
    }
  } catch (e) {
    console.warn('runHeadless error:', e);
  }
  return { devices: WORLD.devices, tick: WORLD.tick };
}

function evalAssert(exprStr, env) {
  try {
    const fn = new Function('devices', 'tick', 'd0', 'd1', 'd2', 'd3', 'd4', 'd5', `return (${exprStr});`);
    const ds = env.devices;
    return !!fn(ds, env.tick, ds[0], ds[1], ds[2], ds[3], ds[4], ds[5]);
  } catch (e) {
    console.warn('assert error', e);
    return false;
  }
}

function runTests(ch) {
  // Tests must be deterministic regardless of the kid's slider position.
  // Default test knobs: no drops, no delay, fixed seed. The challenge can
  // override via `ch.knobs` (chapter 2/3 will, e.g. dropPct: 50, seed: 1).
  const savedKnobs = { ...WORLD.knobs };
  Object.assign(WORLD.knobs, { dropPct: 0, delayMs: 0, jitter: 0, reorder: false, seed: 1 });
  if (ch.knobs) Object.assign(WORLD.knobs, ch.knobs);
  const results = [];
  for (const test of ch.tests || []) {
    const maxT = test.t || 0;
    const env = runHeadless(maxT, compileDevicesForChallenge());
    results.push({ label: test.label || ('t=' + maxT), pass: evalAssert(test.assert, env) });
  }
  WORLD.knobs = savedKnobs;
  setSeed(WORLD.knobs.seed);
  return results;
}

function renderTestResults(results) {
  const el = document.getElementById('ch-tests');
  el.innerHTML = results.map(r =>
    `<div class="${r.pass ? 't-pass' : 't-fail'}">${r.pass ? '✅' : '❌'} ${r.label}</div>`
  ).join('');
  const allPass = results.length > 0 && results.every(r => r.pass);
  const msg = document.getElementById('ch-msg');
  msg.className = 'ch-msg ' + (allPass ? 'success' : 'fail');
  msg.textContent = allPass ? '🎉 Brawo! Wszystkie testy przechodzą.' : 'Niektóre testy nie przechodzą.';
  return allPass;
}

function awardStar(ch, n) {
  if (!STATE.stage || STATE.challenge == null) return;
  const all = progress();
  const entry = all[STATE.stage] = all[STATE.stage] || { stars: [] };
  const prev = entry.stars[STATE.challenge] || 0;
  entry.stars[STATE.challenge] = Math.max(prev, n);
  saveProgress(all);
  const stars = entry.stars[STATE.challenge];
  document.getElementById('ch-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  updateStarsBadge();
}

function updateStarsBadge() {
  let earned = 0, total = 0;
  for (const st of STAGES) {
    const chs = CHALLENGES[st.id] || [];
    total += chs.length * 3;
    const pp = stageProgress(st.id);
    earned += (pp.stars || []).reduce((a, b) => a + (b || 0), 0);
  }
  document.getElementById('stars-badge').textContent = `⭐ ${earned} / ${total}`;
}

document.getElementById('btn-run').addEventListener('click', () => {
  worldStop();
  worldReset(compileDevicesForChallenge());
  renderDevices();
  worldStart();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  worldStop();
  worldReset(compileDevicesForChallenge());
  renderDevices();
});
document.getElementById('btn-check').addEventListener('click', () => {
  const ch = (CHALLENGES[STATE.stage] || [])[STATE.challenge];
  if (!ch) return;
  worldStop();
  const results = runTests(ch);
  const pass = renderTestResults(results);
  if (pass) awardStar(ch, 3);
});

function __dev_tests() {
  const fail = [], pass = [];
  const t = (name, cond) => (cond ? pass : fail).push(name);

  const d1 = makeDevice({ name: 'A', channel: 1 });
  t('num literal',   evalExpr({ id: 'num', slots: { n: 5 } }, { device: d1 }) === 5);
  t('op add',        evalExpr({ id: 'op', slots: { a: 2, op: '+', b: 3 } }, { device: d1 }) === 5);
  t('op div zero',   evalExpr({ id: 'op', slots: { a: 10, op: '/', b: 0 } }, { device: d1 }) === 0);

  const d2 = makeDevice();
  runStatement({ id: 'set-state', slots: { field: 'hp', val: 3 } }, { device: d2 });
  t('set-state', d2.state.hp === 3);
  runStatement({ id: 'led-on', slots: { x: 2, y: 1 } }, { device: d2 });
  t('led-on', d2.display[1 * 5 + 2] === 1);
  runStatement({ id: 'screen-fill', slots: { c: '1' } }, { device: d2 });
  t('screen-fill on', d2.display.every(v => v === 1));
  runStatement({ id: 'screen-fill', slots: { c: '0' } }, { device: d2 });
  t('screen-fill off', d2.display.every(v => v === 0));

  // Broadcast on same channel: receiver lights up via on-message handler.
  // Reset knobs to default (no drops, no delay) before scenarios that
  // expect deterministic delivery — earlier tests may have changed them.
  WORLD.knobs.dropPct = 0; WORLD.knobs.delayMs = 0; WORLD.knobs.reorder = false;
  worldReset([
    makeDevice({ name: 'A', channel: 1, script: [
      { id: 'on-start', body: [{ id: 'broadcast', slots: { msg: 'ping', ch: 1 } }] },
    ]}),
    makeDevice({ name: 'B', channel: 1, script: [
      { id: 'on-message', slots: { msg: 'ping', ch: 1 }, body: [{ id: 'led-on', slots: { x: 0, y: 0 } }] },
    ]}),
    makeDevice({ name: 'C', channel: 2, script: [
      { id: 'on-message', slots: { msg: 'ping', ch: 1 }, body: [{ id: 'led-on', slots: { x: 0, y: 0 } }] },
    ]}),
  ]);
  stepOnce();
  t('broadcast reaches same channel',  WORLD.devices[1].display[0] === 1);
  t('broadcast skips other channel',   WORLD.devices[2].display[0] === 0);
  t('lastMsg recorded on receiver',    WORLD.devices[1].lastMsg === 'ping');

  // Drop rate observed ≈ configured over many messages. Seeded for reproducibility.
  WORLD.knobs.dropPct = 50; WORLD.knobs.delayMs = 0; WORLD.knobs.seed = 42;
  worldReset([
    makeDevice({ name: 'A', channel: 1, script: [
      { id: 'on-tick', body: [{ id: 'broadcast', slots: { msg: 'p', ch: 1 } }] },
    ]}),
    makeDevice({ name: 'B', channel: 1 }),
  ]);
  for (let i = 0; i < 1000; i++) stepOnce();
  const rate = WORLD.stats[1].delivered / WORLD.stats[1].sent;
  t('drop ~50% over 1000 (seed=42)', Math.abs(rate - 0.5) < 0.05);

  // Delay: with delayMs=200 (~6 ticks at 30Hz) message should NOT arrive at tick 0.
  WORLD.knobs.dropPct = 0; WORLD.knobs.delayMs = 200; WORLD.knobs.jitter = 0; WORLD.knobs.seed = 7;
  worldReset([
    makeDevice({ name: 'A', channel: 1, script: [
      { id: 'on-start', body: [{ id: 'broadcast', slots: { msg: 'late', ch: 1 } }] },
    ]}),
    makeDevice({ name: 'B', channel: 1, script: [
      { id: 'on-message', slots: { msg: 'late', ch: 1 }, body: [{ id: 'led-on', slots: { x: 0, y: 0 } }] },
    ]}),
  ]);
  stepOnce();  // on-start fires, message buffered with deliverAt = 0 + 6 = 6
  t('delayed not delivered yet',   WORLD.devices[1].display[0] === 0);
  for (let i = 0; i < 6; i++) stepOnce();  // ticks 1..6
  t('delayed delivered after wait', WORLD.devices[1].display[0] === 1);

  // Cleanup knobs so any subsequent code starts clean.
  WORLD.knobs.dropPct = 0; WORLD.knobs.delayMs = 0; WORLD.knobs.jitter = 0.5; WORLD.knobs.reorder = false; WORLD.knobs.seed = null;
  setSeed(null);

  console.log('%cRadioRoom dev tests', 'font-weight:bold', `${pass.length} pass, ${fail.length} fail`);
  pass.forEach(n => console.log('  ✅', n));
  fail.forEach(n => console.warn('  ❌', n));
  return { pass: pass.length, fail: fail.length };
}

if (new URLSearchParams(location.search).get('dev') === '1') {
  window.addEventListener('load', () => { setTimeout(__dev_tests, 100); });
}
window.ps.__dev_tests = __dev_tests;
</script>
